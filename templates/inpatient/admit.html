{% extends "base.html" %}
{% block title %}{{ t('Admit Patient', 'تنويم مريض') }}{% endblock %}
{% block content %}
<div class="pf-page-header">
  <div><h1 class="pf-page-title">{{ t('🏥 Admit Patient', '🏥 تنويم مريض') }}</h1></div>
  <div class="pf-topbar-actions">
    <a href="{{ url_for('inpatient.dashboard') }}" class="pf-btn pf-btn-secondary">{{ t('← Back', '← رجوع') }}</a>
  </div>
</div>

<div class="pf-card" style="max-width:760px;margin:0 auto">
  <form method="post">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
    <div class="pf-form-grid">

      <div class="pf-form-group" style="grid-column:1/-1">
        <label class="pf-label">{{ t('Owner *', 'المالك *') }}</label>
        <select name="owner_id" id="ownerSelect" class="pf-input" required onchange="loadPets(this.value)">
          <option value="">{{ t('— select owner —', '— اختر المالك —') }}</option>
          {% for o in owners %}
          <option value="{{ o.id }}">{{ o.full_name }} ({{ o.phone }})</option>
          {% endfor %}
        </select>
      </div>

      <div class="pf-form-group" style="grid-column:1/-1">
        <label class="pf-label">{{ t('Pet *', 'الحيوان *') }}</label>
        <select name="pet_id" id="petSelect" class="pf-input" required>
          <option value="">{{ t('— select owner first —', '— اختر المالك أولاً —') }}</option>
        </select>
      </div>

      <div class="pf-form-group">
        <label class="pf-label">{{ t('Ward', 'العنبر') }}</label>
        <select name="ward" class="pf-input">
          {% for w in wards %}<option>{{ w }}</option>{% endfor %}
        </select>
      </div>
      <div class="pf-form-group">
        <label class="pf-label">{{ t('Cage / Kennel Number', 'رقم القفص') }}</label>
        <input type="text" name="cage_number" class="pf-input" placeholder="e.g. K-3">
      </div>

      <div class="pf-form-group" style="grid-column:1/-1">
        <label class="pf-label">{{ t('Reason for Admission *', 'سبب التنويم *') }}</label>
        <textarea name="reason" class="pf-input" rows="2" required placeholder="{{ t('Chief complaint / reason for hospitalisation', 'الشكوى الرئيسية / سبب التنويم') }}"></textarea>
      </div>

      <div class="pf-form-group" style="grid-column:1/-1">
        <label class="pf-label">{{ t('Initial Diagnosis', 'التشخيص المبدئي') }}</label>
        <input type="text" name="diagnosis" class="pf-input" placeholder="{{ t('Working diagnosis', 'التشخيص المبدئي') }}">
      </div>

      <div class="pf-form-group" style="grid-column:1/-1">
        <label class="pf-label">{{ t('Treatment Plan', 'خطة العلاج') }}</label>
        <textarea name="treatment_plan" class="pf-input" rows="3" placeholder="{{ t('IV fluids, monitoring, medications…', 'سوائل وريدية، مراقبة، أدوية…') }}"></textarea>
      </div>

      <div class="pf-form-group">
        <label class="pf-label">{{ t('Expected Discharge Date', 'تاريخ الخروج المتوقع') }}</label>
        <input type="date" name="expected_discharge" class="pf-input" min="{{ today }}">
      </div>
      <div class="pf-form-group">
        <label class="pf-label">{{ t('Daily Rate (EGP)', 'السعر اليومي (جنيه)') }}</label>
        <input type="number" step="0.01" name="daily_rate" class="pf-input" value="0" min="0">
      </div>

    </div>
    <div style="margin-top:1.5rem;display:flex;gap:.75rem;justify-content:flex-end">
      <a href="{{ url_for('inpatient.dashboard') }}" class="pf-btn pf-btn-secondary">{{ t('Cancel', 'إلغاء') }}</a>
      <button type="submit" class="pf-btn pf-btn-primary">{{ t('🏥 Admit Patient', '🏥 تنويم مريض') }}</button>
    </div>
  </form>
</div>

<script>
function loadPets(ownerId) {
  const sel = document.getElementById('petSelect');
  sel.innerHTML = '<option value="">Loading…</option>';
  if (!ownerId) { sel.innerHTML = '<option value="">— select owner first —</option>'; return; }
  fetch(`/inpatient/api/owner/${ownerId}/pets`)
    .then(r => r.json())
    .then(pets => {
      sel.innerHTML = pets.length
        ? pets.map(p => `<option value="${p.id}">${p.pet_name} (${p.species})</option>`).join('')
        : '<option value="">No pets found</option>';
    });
}
</script>
{% endblock %}
