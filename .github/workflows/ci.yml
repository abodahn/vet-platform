name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (SQLite, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # TEST_POSTGRES_DSN is deliberately unset: tests/conftest.py then builds a
      # throwaway SQLite database, so no service container is needed here.
      - name: Run tests
        run: pytest tests -q

  tests-postgres:
    name: tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    # Not blocking yet — tests/test_postgres_full.py still targets a hardcoded
    # `vetclinic` database instead of TEST_POSTGRES_DSN, so this job cannot go
    # green until that file is fixed. Flip to `false` (or delete this line) once
    # it honours the DSN and the job passes.
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          # `trust` accepts any password, so CI needs no credential at all —
          # nothing to hardcode here and no repo secret to consume.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # conftest.py drops and recreates this database at session start.
      TEST_POSTGRES_DSN: postgresql://postgres@localhost:5432/vetclinic_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests against PostgreSQL
        run: pytest tests -q
