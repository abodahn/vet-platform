name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (SQLite, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # TEST_POSTGRES_DSN is deliberately unset: tests/conftest.py then builds a
      # throwaway SQLite database, so no service container is needed here.
      - name: Run tests
        run: pytest tests -q

  tests-postgres:
    name: tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    # BLOCKING. It was not, and the reason has gone: test_postgres_full.py now
    # honours TEST_POSTGRES_DSN instead of a hardcoded `vetclinic`.
    #
    # This matters more than any single test in it. Production runs PostgreSQL
    # and the app writes SQLite-flavoured SQL translated by _fix_sql, so a
    # query can pass every check on SQLite and fail on the engine a clinic
    # actually runs. 47 of the 506 bugs in .wolf/buglog.json - nine percent -
    # are that exact shape: %s versus ?, NOW() versus datetime('now'), ::text
    # casts, "no such column", DDL that parses on one engine and not the other.
    #
    # While this job was advisory, a green build was a statement about SQLite.
    # Now the build fails where a clinic would have.
    services:
      postgres:
        image: postgres:16
        env:
          # `trust` accepts any password, so CI needs no credential at all —
          # nothing to hardcode here and no repo secret to consume.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # conftest.py drops and recreates this database at session start.
      #
      # The name MUST contain "test": tests/test_postgres_full.py issues DELETE
      # statements and refuses outright to run against a database whose name
      # does not say it is disposable. `vetclinic_ci` did not qualify, so the
      # suite raised at import and the job could never go green - which is what
      # kept it advisory, not the DSN handling the old comment blamed.
      TEST_POSTGRES_DSN: postgresql://postgres@localhost:5432/vetclinic_ci_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests against PostgreSQL
        run: pytest tests -q
