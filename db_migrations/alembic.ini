# Alembic config for the Aleefy veterinary platform.
#
# Always invoke with an explicit -c, from the platform root:
#     alembic -c db_migrations/alembic.ini current
#
# There is no sqlalchemy.url here on purpose. env.py derives the URL from the
# same environment variables the Flask app reads (POSTGRES_DSN, else
# PLATFORM_DB_PATH, else <platform>/data/platform.db) so alembic can never end
# up pointed at a different database than the app. Do not add credentials here.

[alembic]
# %(here)s = the directory holding this file, so the path survives the project
# being moved between drives.
script_location = %(here)s
prepend_sys_path = %(here)s/..
version_path_separator = os

# Timestamped, readable revision filenames: 0002_add_foo.py
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
